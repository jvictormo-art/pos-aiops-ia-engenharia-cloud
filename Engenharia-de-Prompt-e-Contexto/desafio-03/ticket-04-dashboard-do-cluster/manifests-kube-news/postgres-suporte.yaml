# Postgres de apoio para os dois workloads de evidência do Ticket 04.
# Não passa pela skill metacortex-manifest: é infraestrutura de suporte para o
# demo, não um workload de cliente sujeito ao padrão. Ver curadoria.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg
  namespace: nyx-dev
spec:
  replicas: 1
  selector:
    matchLabels: {app: pg}
  template:
    metadata:
      labels: {app: pg}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: "kubedevnews"}
            - {name: POSTGRES_USER, value: "kubedevnews"}
            - {name: POSTGRES_PASSWORD, value: "Pg#123"}
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: pg
  namespace: nyx-dev
spec:
  selector: {app: pg}
  ports:
    - {port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg
  namespace: orion-prod
spec:
  replicas: 1
  selector:
    matchLabels: {app: pg}
  template:
    metadata:
      labels: {app: pg}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: "ecommerce"}
            - {name: POSTGRES_USER, value: "orion"}
            - {name: POSTGRES_PASSWORD, value: "orion-db-pass"}
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: pg
  namespace: orion-prod
spec:
  selector: {app: pg}
  ports:
    - {port: 5432, targetPort: 5432}
